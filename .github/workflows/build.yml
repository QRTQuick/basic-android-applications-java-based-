name: Android CI (root)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make wrapper executable
        run: |
          cd "project 0ne dat and time app"
          chmod +x gradlew || true

      - name: Build with Gradle wrapper
        run: |
          cd "project 0ne dat and time app"
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project 0ne dat and time app/app/build/outputs/apk/debug/app-debug.apk

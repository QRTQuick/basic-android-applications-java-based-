name: Android CI (root)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.5'

      - name: Build project
        run: |
          cd "project 0ne dat and time app"
          gradle clean assembleDebug
